<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출석 알림 만들기</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d1b18;--mute:#6b665d;--line:#dcd7cc;--accent:#c8321e;--accent-ink:#fff;--ok:#1f7a4d;--field:#faf8f3;
  --font:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#171614;--card:#211f1c;--ink:#f1ede4;--mute:#a39d90;--line:#3a3731;--accent:#ff6a4f;--accent-ink:#1a0b07;--ok:#59c48c;--field:#1b1a17;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;padding:20px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left))}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:26px;line-height:1.25;margin:0}
h2{font-size:15px;margin:0 0 10px;color:var(--mute)}
p{margin:0}
.lead{color:var(--mute);margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.rows{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:56px 68px 68px minmax(0,1fr) 36px;gap:4px;align-items:center}
select,input[type=text],input[type=date]{width:100%;min-width:0;height:44px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--ink);font:inherit;padding:0 8px}
.row select{font-size:15px;padding:0 2px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
button{font:inherit;cursor:pointer}
.x{height:44px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--mute);padding:0}
.add{height:44px;border:1px dashed var(--mute);border-radius:8px;background:transparent;color:var(--ink);width:100%;margin-top:10px}
.hint{font-size:13px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:12px}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.chk input{width:24px;height:24px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.chk span{display:flex;flex-direction:column}
.chk small{font-size:13px;color:var(--mute)}
.go{height:60px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;width:100%}
.go[disabled]{opacity:.5;cursor:not-allowed}
.msg{min-height:24px;font-size:15px;margin-top:10px}
.msg.ok{color:var(--ok);font-weight:700}.msg.err{color:var(--accent)}
</style>
</head>
<body>
<main>
  <header>
    <h1>출석 알림 만들기</h1>
    <p class="lead">시간표를 적고 버튼을 한 번 누르면 구글 캘린더에 알림이 들어갑니다.</p>
  </header>

  <section class="panel">
    <h2>1. 내 시간표</h2>
    <div class="rows" id="rows"></div>
    <button class="add" id="add" type="button">+ 수업 추가</button>
  </section>

  <section class="panel">
    <h2><label for="until">2. 종강일</label></h2>
    <input type="date" id="until" value="2026-12-18">
    <p class="hint" style="margin-top:6px">기말고사 마지막 날로 바꾸세요. 이 날까지 매주 알림이 옵니다.</p>
  </section>

  <section class="panel">
    <h2>3. 받을 알림</h2>
    <div class="list">
      <label class="chk"><input type="checkbox" id="kA" checked><span><b>출석 알림</b><small>수업 시작 10분 전에 "출석 시작 지금 체크하기"</small></span></label>
      <label class="chk"><input type="checkbox" id="kB" checked><span><b>지각 변경 요청 알림</b><small>수업 시작 시각에 "지각 안 했는데 시스템상 지각이면 교수님께 변경 요청하기"</small></span></label>
    </div>
  </section>

  <section class="panel">
    <button class="go" id="go" type="button">구글 캘린더에 적용</button>
    <p class="msg" id="msg" role="status"></p>
    <p class="hint">구글 로그인 창이 뜨면 허용을 누르세요. "확인되지 않은 앱"이라고 나오면 아래쪽 "고급"을 눌러 계속하세요. 이 앱은 자신이 만든 "출석알림", "변경요청알림" 캘린더에만 접근하고 다른 일정은 볼 수 없습니다. 변경 요청 알림이 싫어지면 구글 캘린더에서 "변경요청알림" 캘린더만 지우세요.</p>
  </section>
</main>

<script>
(function(){
  // ▼▼▼ 관리자가 한 번만 바꾸는 곳: 구글 클라우드에서 받은 클라이언트 ID ▼▼▼
  var CLIENT_ID="여기에_클라이언트_ID를_붙여넣기";
  // ▲▲▲
  var SCOPE="https://www.googleapis.com/auth/calendar.app.created", TZ="Asia/Seoul";
  var DAYS=["월","화","수","목","금","토"], JS_DAY={"월":1,"화":2,"수":3,"목":4,"금":5,"토":6};
  var KIND={A:{off:-10,line:"출석 시작 지금 체크하기",cal:"출석알림"},B:{off:0,line:"지각 안 했는데 시스템상 지각이면 교수님께 변경 요청하기",cal:"변경요청알림"}};
  var pad=function(n){return (n<10?"0":"")+n};

  function clean(name){return Array.from(name.trim().replace(/[\[\]]/g,"")).slice(0,12).join("")}
  function startOf(today,c,K){
    var d=new Date(today.getFullYear(),today.getMonth(),today.getDate());
    d.setDate(d.getDate()+(JS_DAY[c.day]-d.getDay()+7)%7);
    var hm=c.time.split(":"); d.setHours(+hm[0],+hm[1]+K.off,0,0); return d;
  }
  function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":00"}
  function weeksUntil(first,untilStr){
    var f=Date.UTC(first.getFullYear(),first.getMonth(),first.getDate()), p=untilStr.split("-"), u=Date.UTC(+p[0],+p[1]-1,+p[2]);
    return Math.max(1,Math.floor(Math.round((u-f)/86400000)/7)+1);
  }
  window.buildEvent=function(c,kind,untilStr,today){
    var K=KIND[kind], s=startOf(today,c,K), e=new Date(s.getTime()+60000), text="["+clean(c.name)+"] "+K.line;
    return {summary:text,description:K.line,
      start:{dateTime:iso(s),timeZone:TZ},end:{dateTime:iso(e),timeZone:TZ},
      recurrence:["RRULE:FREQ=WEEKLY;COUNT="+weeksUntil(s,untilStr)],
      reminders:{useDefault:false,overrides:[{method:"popup",minutes:0}]}};
  };

  var rowsEl=document.getElementById("rows"), untilEl=document.getElementById("until"), msg=document.getElementById("msg"), go=document.getElementById("go");
  function opt(sel,v,t){var o=document.createElement("option");o.value=v;o.textContent=t;sel.appendChild(o)}
  function rowEl(d){
    var r=document.createElement("div"); r.className="row";
    var D=document.createElement("select"); D.setAttribute("aria-label","요일"); DAYS.forEach(function(x){opt(D,x,x)}); D.value=DAYS.indexOf(d.day)>=0?d.day:"월";
    var hh=9, mm=0, m=/^(\d{1,2}):(\d\d)$/.exec(d.time||""); if(m){hh=+m[1];mm=+m[2]}
    var H=document.createElement("select"); H.setAttribute("aria-label","시작 시"); for(var i=0;i<=23;i++)opt(H,i,i+"시"); H.value=hh;
    var M=document.createElement("select"); M.setAttribute("aria-label","시작 분");
    var mins=[]; for(var j=0;j<60;j+=5)mins.push(j); if(mins.indexOf(mm)<0){mins.push(mm);mins.sort(function(a,b){return a-b})}
    mins.forEach(function(v){opt(M,v,pad(v)+"분")}); M.value=mm;
    var n=document.createElement("input"); n.type="text"; n.placeholder="과목명"; n.value=d.name||""; n.maxLength=20; n.setAttribute("aria-label","과목명");
    var x=document.createElement("button"); x.type="button"; x.className="x"; x.textContent="✕"; x.setAttribute("aria-label","이 수업 지우기"); x.onclick=function(){r.remove();save()};
    [D,H,M,n].forEach(function(e){e.addEventListener("input",save)});
    r.append(D,H,M,n,x); return r;
  }
  function read(){return Array.from(rowsEl.children).map(function(r){var q=r.querySelectorAll("select,input");return {day:q[0].value,time:pad(+q[1].value)+":"+pad(+q[2].value),name:q[3].value}})}
  function valid(l){return l.filter(function(c){return c.name.trim()})}
  function save(){try{localStorage.setItem("att-tt",JSON.stringify({rows:read(),until:untilEl.value}))}catch(e){}}
  function say(t,k){msg.className="msg"+(k?" "+k:"");msg.textContent=t}
  function selected(){var k=[];if(document.getElementById("kA").checked)k.push("A");if(document.getElementById("kB").checked)k.push("B");return k}

  async function api(token,path,body){
    var res=await fetch("https://www.googleapis.com/calendar/v3"+path,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify(body)});
    var j=null; try{j=await res.json()}catch(e){}
    if(!res.ok){var er=new Error((j&&j.error&&j.error.message)||("HTTP "+res.status)); er.status=res.status; throw er}
    return j;
  }
  async function run(token,list,ks,today){
    var total=list.length*ks.length, done=0;
    go.disabled=true;
    try{
      for(var a=0;a<ks.length;a++){
        var k=ks[a], cal=await api(token,"/calendars",{summary:KIND[k].cal,timeZone:TZ});
        for(var b=0;b<list.length;b++){
          await api(token,"/calendars/"+encodeURIComponent(cal.id)+"/events",window.buildEvent(list[b],k,untilEl.value,today));
          done++; say("넣는 중… "+done+" / "+total);
        }
      }
      say("끝났습니다. 구글 캘린더 앱을 열어 확인하세요. 다시 누르면 중복으로 들어가니 누르지 마세요.","ok");
    }catch(e){
      go.disabled=false;
      say((done?done+"개를 넣은 뒤 ":"")+"실패했습니다("+(e.message||"알 수 없는 오류")+"). 구글 캘린더에 생긴 "+'"출석알림"·"변경요청알림"'+" 캘린더를 지우고 다시 시도하세요.","err");
    }
  }
  go.onclick=function(){
    var list=valid(read()), ks=selected(), today=new Date();
    if(!list.length)return say("수업의 과목명을 먼저 적어 주세요.","err");
    if(!ks.length)return say("받을 알림을 하나 이상 골라 주세요.","err");
    if(!untilEl.value||new Date(untilEl.value+"T00:00:00")<new Date(today.getFullYear(),today.getMonth(),today.getDate()))return say("종강일을 확인해 주세요.","err");
    if(CLIENT_ID.indexOf("여기에")===0)return say("관리자 설정이 아직 안 됐습니다(클라이언트 ID).","err");
    if(!window.google||!google.accounts||!google.accounts.oauth2)return say("구글 로그인을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로고침하세요.","err");
    say("구글 로그인 창에서 허용을 눌러 주세요.");
    var tc=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,
      callback:function(r){ if(r&&r.access_token)run(r.access_token,list,ks,today); else say("로그인이 취소됐거나 허용되지 않았습니다.","err")},
      error_callback:function(){say("로그인 창이 닫혔거나 열리지 않았습니다. 팝업 차단을 확인하세요.","err")}});
    tc.requestAccessToken();
  };
  document.getElementById("add").onclick=function(){rowsEl.appendChild(rowEl({}));save()};
  untilEl.addEventListener("input",save);
  ["kA","kB"].forEach(function(id){document.getElementById(id).addEventListener("change",function(){say("")})});

  var init=null; try{init=JSON.parse(localStorage.getItem("att-tt")||"null")}catch(e){}
  if(init&&init.rows&&init.rows.length){init.rows.forEach(function(r){rowsEl.appendChild(rowEl(r))}); if(init.until)untilEl.value=init.until}
  else{[{day:"월"},{day:"화"}].forEach(function(r){rowsEl.appendChild(rowEl(r))})}
})();
</script>
</body>
</html>
